name: Verify portfolio warehouse
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python scripts/verify_source.py
      - run: pip install -r examples/local-demo/requirements.txt
      - run: python examples/local-demo/scripts/demo.py
